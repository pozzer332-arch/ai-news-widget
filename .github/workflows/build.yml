name: 📦 Сборка Windows-установщика

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nsis:
    name: electron-builder → NSIS
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Синтаксический контроль
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          node -e "JSON.parse(require('fs').readFileSync('models.json','utf8')); console.log('models.json: OK')"

      - name: Сборка установщика
        run: npm run dist

      - name: Проверить, что артефакт существует
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Установщик не собран" }
          "Собрано: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) МБ)"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: AI-News-Widget-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            ### 📥 Установка
            1. Скачайте `AI-News-Widget-Setup-*.exe`
            2. Запустите и следуйте мастеру установки
            3. Ярлык **AI News Widget** появится на рабочем столе

            > **Windows:** если Smart App Control показывает предупреждение,
            > приложение не подписано — это нормально для open-source-сборки.
